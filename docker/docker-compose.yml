# One-command rosbridge for Nano-sim. Pick a profile:
#   docker compose --profile humble up --build
#   docker compose --profile jazzy  up --build
#   docker compose --profile noetic up --build
# rosbridge is published on localhost:9090; point Unity's NetworkManager at
# 127.0.0.1:9090 and press Connect.
services:
  ros2-humble:
    profiles: ["humble"]
    build: { context: .., dockerfile: docker/Dockerfile.ros2-humble }
    image: nanosim-ros:humble
    ports: ["9090:9090"]
    tty: true

  ros2-jazzy:
    profiles: ["jazzy"]
    build: { context: .., dockerfile: docker/Dockerfile.ros2-jazzy }
    image: nanosim-ros:jazzy
    ports: ["9090:9090"]
    tty: true

  ros1-noetic:
    profiles: ["noetic"]
    build: { context: .., dockerfile: docker/Dockerfile.ros1-noetic }
    image: nanosim-ros:noetic
    ports: ["9090:9090"]
    tty: true
